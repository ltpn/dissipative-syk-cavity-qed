[grid]
configs = ["physical"]
etas = [0.05, 0.4, 1.0]
gammas = [1.0, 10.0]
seed_count = 2
baseline_svd_tol = 1e-10

[numerics]
n_orb = 4
n_grid = 64
box_length = 15.0
correlation_length = 1.0
disorder_strength = 1.0
J = 1.0
lambda_c_micron = 0.671
kappa_over_2pi_mhz = 0.2
# Pinned so the two `gammas` points differ only in gamma_eff (kappa/Delta = 0.2).
delta_cd_over_2pi_mhz = 1.0

[numerics.time_grid]
t_min = 1e-2
t_max = 1e4
n = 120

[dynamics]
entropy_eig_tol = 1e-12

[execution]
parallel_tasks = 1
blas_threads = 1

[output]
data_subdir = "smoke/physical_n4/merged"
